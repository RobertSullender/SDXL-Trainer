[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sdxl-trainer"
version = "0.1.34"
description = "Private, offline SDXL dataset preparation and training desktop application"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["Pillow>=10", "PySide6==6.10.2"]

[project.optional-dependencies]
training = ["torch>=2.7", "diffusers>=0.35,<0.40", "transformers>=4.51,<6", "peft>=0.17,<0.20", "accelerate>=1.2,<2", "safetensors>=0.5", "numpy>=1.26"]
test = ["pytest>=8"]

[project.scripts]
sdxl-trainer = "sdxl_trainer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sdxl_trainer = ["assets/*", "wiki/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
